report.easi.grp_easi_scale._Instructions_easi = Instructions: The question can be asked by the caregiver or if not available directly from participant.
report.easi.grp_easi_scale.easi_raw1 = 1. Forgets he/she has just eaten and asks for food again
report.easi.grp_easi_scale.easi_raw2 = 2. Urinates in an appropriate place
report.easi.grp_easi_scale.easi_raw3 = 3. Clothes get dirty from urine or stools
