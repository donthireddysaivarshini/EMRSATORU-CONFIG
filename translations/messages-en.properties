report.cog5.grp_cog5_scale.grp_picture_based_screening_test.triangle_thing = For this next part I will ask you to name which number goes with each symbol. Look up here at the top, each number has a symbol associated with it. Down here, we have the same symbols, but the numbers are missing. I want you to tell me which number goes with each symbol. For example: See this mark right here (point to first practice item), on the key the mark goes with 4, so you would say 4. What would you say for this mark? Now that you know how to do these, I want you to start right here and tell me the numbers that go with each of these shapes. Go in order (use finger to demonstrate). When you finish one row, keep going to the next row until I tell you to stop. Work as fast as you can without making mistakes. You can use your finger to keep track of where you are. Do you have any questions? (Answer questions). Ready? Go ahead. Time 90 Sec. jr://images/tri.png
