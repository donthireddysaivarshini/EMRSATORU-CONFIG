report.easi.grp_easi_scale.easi_raw5 = 5. Does he/she have their Dhoti/petticoat/saree tied properly?
report.easi.grp_easi_scale.easi_raw6 = 6. He/she able to work as a member of a team i.e in a group activity, which requires different roles from people, will he/she be able to participate?
report.easi.grp_easi_scale.easi_raw7 = 7. Does he/she express his/her opinion appropriately on important family matters, eg: marriage?
report.easi.grp_easi_scale.easi_raw8 = 8. If he/she is assigned or himself/herself decides to undertake an important task, can he/she follow it through completion?
