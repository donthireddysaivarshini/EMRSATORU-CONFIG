report.moca.m8_g_attention.m8_serial7_inst = 📋 SERIAL 7 SUBTRACTION — CLEAR INSTRUCTIONS: 1. Instruct participant: "Now, I will ask you to count by subtracting seven from seventy, and keep subtracting seven from your answer until I tell you to stop." 2. Give instruction twice if needed. Do NOT interrupt, give hints, or correct math. 3. Correct Subtraction Steps: [1] 70 - 7 = 63 [2] 63 - 7 = 56 [3] 56 - 7 = 49 [4] 49 - 7 = 42 [5] 42 - 7 = 35 4. Independent Subtraction Rule: Each subtraction is scored independently. (e.g. if subject says "62, 55, 48, 41, 34" — 62 is wrong, but 55, 48, 41, 34 are all correct subtractions from the previous number, so award 4 correct = 3 points). 5. Score criteria: 4-5 correct = 3 pts | 2-3 correct = 2 pts | 1 correct = 1 pt | 0 correct = 0 pts.
