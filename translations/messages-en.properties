report.moca.m8_g_attention.m8_digits_inst = Read list of digits ( 1 digit/ sec. ).
report.moca.m8_g_attention.m8_vigilance_inst = 📋 VIGILANCE — CLEAR INSTRUCTIONS: 1. Instruct participant: "I am going to read a sequence of letters. Every time I say the letter A, tap your hand once on the table. If I say a different letter, do NOT tap your hand." 2. Assessor guideline: Read letters at exactly 1 letter per second. 3. Sequence (tap ONLY on [A]): F B [A] C M N [A] [A] J K L B [A] F [A] K D E [A] [A] [A] J [A] M O F [A] [A] B 4. Scoring: 1 point if 0 or 1 error (tapping on non-A letter or failing to tap on A). 0 points if >= 2 errors.
report.moca.m8_g_attention.m8_serial7_inst = 📋 SERIAL 7 SUBTRACTION — CLEAR INSTRUCTIONS: 1. Instruct participant: "Now, I will ask you to count by subtracting seven from seventy, and keep subtracting seven from your answer until I tell you to stop." 2. Give instruction twice if needed. Do NOT interrupt, give hints, or correct math. 3. Correct Subtraction Steps: [1] 70 - 7 = 63 [2] 63 - 7 = 56 [3] 56 - 7 = 49 [4] 49 - 7 = 42 [5] 42 - 7 = 35 4. Independent Subtraction Rule: Each subtraction is scored independently. (e.g. if subject says "62, 55, 48, 41, 34" — 62 is wrong, but 55, 48, 41, 34 are all correct subtractions from the previous number, so award 4 correct = 3 points). 5. Score criteria: 4-5 correct = 3 pts | 2-3 correct = 2 pts | 1 correct = 1 pt | 0 correct = 0 pts.
report.moca.m8_g_language.m8_fluency_timer_guidance = ⏱️ 1-MINUTE TIMER GUIDANCE: • Instruct: "Tell me as many words you can think of that begin with the letter S in one minute." • Start your stopwatch as soon as you finish instructions. • Stop the participant immediately after exactly 60 seconds (1 minute).
