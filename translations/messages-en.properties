report.cog5.grp_cog5_scale.grp_picture_based_memory_impairment.pmis_image = Here is a sheet with 4 pictures for you to learn and remember. Each picture belongs to a different category. Please say what you see in each picture out loud to me. To help you learn, I will tell you the category for each picture and ask you to name the picture that goes with each category cue. (For example: Which one is fruit?) Remember these pictures because later I will ask you to recall them. jr://images/cow.png
