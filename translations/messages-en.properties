report.moca.te_g_attention.te_serial7_inst = 📋 7 తీసివేయడం (Serial 7s) — స్పష్టమైన సూచనలు: 1. రోగికి చెప్పండి: 'ఇప్పుడు, నేను మిమ్మల్ని 100 నుండి 7 తీసివేయమని అడుగుతాను, ఆపై నేను ఆపమని చెప్పే వరకు మీ సమాధానం నుండి 7 తీసివేస్తూ ఉండండి.' 2. అవసరమైతే ఈ సూచనను రెండుసార్లు ఇవ్వవచ్చు. రోగికి ఎటువంటి సూచనలు ఇవ్వవద్దు లేదా లెక్కను సరిచేయవద్దు. 3. తీసివేత దశలు: [1] 100 - 7 = 93 [2] 93 - 7 = 86 [3] 86 - 7 = 79 [4] 79 - 7 = 72 [5] 72 - 7 = 65 4. స్వతంత్ర తీసివేత నియమం: ప్రతి తీసివేత స్వతంత్రంగా లెక్కించబడుతుంది. 5. స్కోరింగ్: 4-5 సరైనవి = 3 పాయింట్లు | 2-3 సరైనవి = 2 పాయింట్లు | 1 సరైనది = 1 పాయింట్ | 0 సరైనవి = 0 పాయింట్లు.
